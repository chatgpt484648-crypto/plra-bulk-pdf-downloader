<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; max-width: 360px; margin: 0; padding: 10px; font: 13px sans-serif; color: #333; }
    h2 { margin: -10px -10px 10px; padding: 10px; background: #1e6e4f; color: #fff; font-size: 14px; text-align: center; }
    .row { display: flex; gap: 8px; margin-bottom: 8px; }
    button { background: #1e6e4f; color: #fff; border: none; padding: 7px 10px; border-radius: 4px; cursor: pointer; flex: 1; font-size: 12px; }
    button:hover { background: #16533b; }
    #status { font-size: 12px; color: #333; min-height: 32px; word-break: break-all; background: #fafafa; border: 1px solid #ddd; border-radius: 4px; padding: 6px; }
    .hint { font-size: 10px; color: #777; margin-top: 6px; line-height: 1.4; }
  </style>
</head>
<body>
  <h2>PLRA Bulk PDF Downloader</h2>
  <div class="row">
    <button id="scanBtn">Scan Page</button>
    <button id="dlBtn">Bulk Print &amp; Download</button>
  </div>
  <div id="status">Open the registry table page, then click Scan Page.</div>
  <div class="hint">1) Scan Page: counts print rows on this page.<br>2) Bulk Print &amp; Download: clicks every row's print button for you and auto-downloads each PDF as it opens. Keep this tab/page open while it runs.</div>
  <script src="popup.js"></script>
</body>
</html>
